name: Publish v0.2.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/preview-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: biometric-release-v020
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml
          for file in scripts/*.sh; do bash -n "$file"; done
          /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 -m py_compile scripts/*.py
          bash scripts/matebook-biometrics.sh --help
          git ls-files -z README.md docs scripts tests |
            tar --null -T - --transform='s,^,matebook-biometrics-v0.2.0/,' -czf matebook-biometrics-v0.2.0.tar.gz
          sha256sum matebook-biometrics-v0.2.0.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MateBook 14s 2023 Linux 生物识别 v0.2.0" \
            --notes-file docs/release-notes.md --latest \
            matebook-biometrics-v0.2.0.tar.gz SHA256SUMS
