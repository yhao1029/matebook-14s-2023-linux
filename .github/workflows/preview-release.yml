name: Withdraw broken biometric previews
on:
  push:
    branches: [main]
    paths: [.github/workflows/preview-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove only the two superseded preview releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v0.1.0-preview v0.1.1-preview; do
            response=$(mktemp)
            code=$(curl -sS -o "$response" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
            if [[ "$code" == 404 ]]; then continue; fi
            [[ "$code" == 200 ]] || { cat "$response"; exit 1; }
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done
          echo 'Release packages withdrawn. Tags/history retained; no replacement published.'
